name: Deploy
# develop -> dev  -> GitHub Pages at <template>.examples.tsuru.jcampos.dev
# main    -> prod -> S3 + CloudFront at <template>.examples.tsuru.lat
#            (monorepo cloudformation/template-examples-hosting.yml)
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  packages: read
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      VITE_AWS_REGION: us-east-1
      VITE_BASE_DOMAIN: ${{ github.ref_name == 'main' && 'examples.tsuru.lat' || 'examples.tsuru.jcampos.dev' }}
      VITE_LANDING_PAGE_URL: ${{ github.ref_name == 'main' && 'https://www.tsuru.lat' || 'https://tsuru.jcampos.dev' }}
      # Read @chepelcr/tsuru-storefront-sdk from GitHub Packages (same-owner public pkg).
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC, prod only)
        if: env.ENVIRONMENT == 'prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # The storefront reads through the public API with the landing's guest
      # identity pool. dev keeps its pool here and the SDK's default host.
      - name: Resolve build configuration
        run: |
          set -euo pipefail
          if [ "$ENVIRONMENT" = "prod" ]; then
            get() { aws ssm get-parameter --name "/tsuru/prod/landing/$1" --query Parameter.Value --output text; }
            echo "VITE_IDENTITY_POOL_ID=$(get cognito/public-identity-pool-id)" >> "$GITHUB_ENV"
            echo "VITE_PUBLIC_API_URL=$(get api/public-url)" >> "$GITHUB_ENV"
            echo "VITE_API_URL=$(get api/public-url)" >> "$GITHUB_ENV"
          else
            echo "VITE_IDENTITY_POOL_ID=us-east-1:be94bc45-883e-44ff-9eb7-3e58c23ea9e8" >> "$GITHUB_ENV"
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        if: env.ENVIRONMENT == 'dev'
        with:
          path: dist
      # prod: one shared bucket, one prefix per template (repo name minus "template-").
      - name: Publish to S3 + invalidate CloudFront
        if: env.ENVIRONMENT == 'prod'
        run: |
          set -euo pipefail
          prefix="s3://${{ vars.PROD_SITE_BUCKET }}/${GITHUB_REPOSITORY#*/template-}"
          aws s3 sync dist "$prefix" --delete --exclude "assets/*" --cache-control "no-cache"
          aws s3 sync dist/assets "$prefix/assets" --delete --cache-control "public,max-age=31536000,immutable"
          aws cloudfront create-invalidation --distribution-id "${{ vars.PROD_DISTRIBUTION_ID }}" \
            --paths "/${GITHUB_REPOSITORY#*/template-}/*" >/dev/null
  deploy:
    if: github.ref_name == 'develop'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  notify:
    # Tell the org-site provisioner a new bundle is live so it re-mirrors every
    # provisioned org storefront using this template (TEMPLATE_UPDATED event).
    # Runs after the dev Pages deploy or straight after the prod publish.
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.result != 'failure' && vars.AWS_TEMPLATE_EVENTS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref_name == 'main' && vars.PROD_TEMPLATE_EVENTS_ROLE_ARN || vars.AWS_TEMPLATE_EVENTS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Publish TEMPLATE_UPDATED
        env:
          TOPIC_ARN: ${{ github.ref_name == 'main' && vars.PROD_ORG_EVENTS_TOPIC_ARN || vars.TSURU_ORG_EVENTS_TOPIC_ARN }}
        run: |
          # The template's UUID (templates.id), the key the provisioner and the
          # storefront's config.json use — never the repo name.
          TEMPLATE_ID="$(jq -r '.templateId' public/config.json)"
          [ -n "$TEMPLATE_ID" ] && [ "$TEMPLATE_ID" != "null" ] || { echo "::error::public/config.json has no templateId"; exit 1; }
          # snake_case wire contract, pinned by sales-be
          # tests/test_template_updated_handler.py. The event_type attribute is
          # what the subscription FilterPolicy matches on.
          aws sns publish --topic-arn "$TOPIC_ARN" \
            --message-attributes '{"event_type":{"DataType":"String","StringValue":"TEMPLATE_UPDATED"}}' \
            --message "$(printf '{"_type":"TemplateEvent","id":"gh-%s-%s","date":%s,"event_type":"TEMPLATE_UPDATED","data":{"template_id":"%s"}}' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$(date +%s%3N)" "$TEMPLATE_ID")"
